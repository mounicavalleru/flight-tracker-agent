name: BLR USA Flight Tracker

on:
  schedule:
    - cron: '0 * * * *'   # runs every hour, 24/7
  workflow_dispatch:        # allows manual trigger from GitHub

jobs:
  run-flight-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python flight_tracker_agent_v2.py

      - name: Save daily prices back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_lowest_prices.json || true
          git diff --staged --quiet || git commit -m "Update daily prices [skip ci]"
          git push || true
